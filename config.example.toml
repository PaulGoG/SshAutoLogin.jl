# SshAutoLogin configuration template. Copy to config.toml (ignored by git) and edit.

[globals]
# OpenSSH ConnectTimeout
connect_timeout = 10  # integer > 0; units: s

# Host-key verification policy
strict_host_key_checking = "accept-new"  # one of: "accept-new" | "yes" | "no"

# OpenSSH LogLevel
log_level = "ERROR"  # one of: "QUIET" | "FATAL" | "ERROR" | "INFO" | "VERBOSE" | "DEBUG"

[terminal]
# Terminal emulator executable
emulator = "konsole"  # one of: "konsole"

# Window layout
mode = "tabs"  # one of: "tabs" | "windows"

# Keep each tab open after the SSH session ends, until Enter is pressed
hold = false  # one of: true | false

# Time allowed for the emulator to start every session before a warning is issued
launch_settle_timeout = 30  # number > 0; units: s

[[targets]]
# Host name, IPv4 address, or IPv6 literal
host = "192.168.1.100"

# SSH daemon port
port = 22  # integer in [1, 65535]

# Remote account name
user = "admin"

# Authentication password
password = "example_password_1"

# Tab or window title (optional; default: user@host:port)
title = "Cluster Node 01"

# Host-key policy override for this target (optional)
strict_host_key_checking = "accept-new"  # one of: "accept-new" | "yes" | "no"

[[targets]]
host = "192.168.1.101"
port = 2222
user = "developer"
password = "example_password_2"
title = "Dev Gateway"
